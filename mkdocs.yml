site_name: Docs as Code


theme:
  name: readthedocs
  user_color_mode_toggle: true
  color_mode: auto
  features:
      - navigation.sections
      - content.code.copy

nav:
  - Главная: index.md
  - API: api/index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
  - ML:
    - Model Card: ml/model-card.md
    - Data Sheet: ml/dataset.md
    - Риски: ml/risks.md


plugins:
  - search
  - mermaid2
