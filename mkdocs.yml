site_name: Docs as Code


theme:
  name: readthedocs
  user_color_mode_toggle: true
  color_mode: auto
  features:
      - navigation.sections
      - content.code.copy

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md

plugins:
  - search
  - mermaid2
